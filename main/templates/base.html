{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexGen Tuitors</title>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">

    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=109">

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f6f9;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: #1a237e;
            padding: 15px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .navbar img {
            width: 50px;
        }

        /* NAV LINKS */
        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-links a {
            color: white;
            margin: 15px;
            text-decoration: none;
            font-weight: bold;
        }

        /* LOGIN */
        .navbar form {
            margin-left: auto;
        }

        .navbar button {
            background: rgba(255, 213, 79, 0.14);
            color: white;
            border: 1px solid rgba(255, 213, 79, 0.6);
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .navbar button:hover {
            background: #ffd54f;
            color: #1a237e;
        }

        /* ===== MOBILE MENU ===== */
        .menu-toggle {
            display: none;
            font-size: 26px;
            color: white;
            cursor: pointer;
            margin-left: auto;
        }

        @media (max-width: 768px) {

            .menu-toggle {
                display: block;
            }

            .nav-links {
                display: none;
                position: fixed;
                top: 0;
                right: -100%;
                height: 100vh;
                width: 250px;
                padding-top: 80px;
                transition: 0.3s ease;
                flex-direction: column;
                width: 100%;
                background: #1a237e;
                margin-top: 10px;
                z-index: 1000;
            }

            .nav-links a {
                margin: 15px 0;
                text-align: center;
                font-size: 18px;
            }

            .nav-links.active {
                display: flex;
                right: 0;
            }
            .menu-overlay {
                position: fixed;
                inset: 0; 
                background: rgba(0,0,0,0.5);
                display: none;
                z-index: 999;
            }

            .menu-overlay.active {
                display: block;
            }

            .navbar form {
                margin: 10px auto;
            }
        }

        /* ===== HERO ===== */
        .hero {
            background: #3949ab;
            color: white;
            padding: 60px;
            text-align: center;
        }

        /* ===== CONTENT ===== */
        .container {
            padding: 40px;
            text-align: center;
        }

        /* ===== CARDS ===== */
        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* ===== MOBILE CARDS ===== */
        @media (max-width: 768px) {
            .cards {
                flex-direction: column;
                align-items: center;
            }

            .card {
                width: 90%;
            }
        }

        /* ===== FOOTER ===== */
        .footer {
            background: #1a237e;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <!-- ===== NAVBAR ===== -->
<div class="navbar">
    <img src="{% static 'images/logo.png' %}" class="logo">
    
    <button class="menu-toggle" type="button" onclick="toggleMenu()" aria-label="Open menu" aria-expanded="false">
        &#9776;
    </button>

    <div class="nav-links" id="navLinks">
        
        <button class="close-btn" type="button" onclick="toggleMenu()" aria-label="Close menu">
            &times;
        </button>

        <a href="{% url 'home' %}" 
           class="{% if request.path == '/' %}active{% endif %}">
           Home
        </a>

        <a href="{% url 'about' %}" 
           class="{% if request.path == '/about/' %}active{% endif %}">
           About
        </a>

        <a href="{% url 'events' %}" 
           class="{% if request.path == '/events/' %}active{% endif %}">
           Events
        </a>

        <a href="{% url 'contact' %}" 
           class="{% if request.path == '/contact/' %}active{% endif %}">
           Contact
        </a>

        {% if user.is_authenticated %}
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}" 
               class="{% if request.path == '/login/' %}active{% endif %}">
               Login
            </a>
        {% endif %}

    </div>

</div>


    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>

    <!-- ===== CONTENT ===== -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <h3>NexGen Tuitors</h3>
        <p>Email: nexgentuitors@gmail.com</p>
        <p>Phone: +91 8374379176</p>
        <p>© 2025 NexGen Tuitors. All rights reserved.</p>
    </footer>

    <!-- ===== WHATSAPP ===== -->
    <a href="https://wa.me/918374379176?text=Hi%20NexGen%20Tuitors,%20I%20am%20interested%20in%20joining.%20Please%20share%20details."
       class="whatsapp-btn" target="_blank">
        <svg viewBox="0 0 32 32" width="28" height="28" fill="white">
            <path d="M16 .4C7.4.4.4 7.4.4 16c0 2.8.7 5.5 2.1 7.9L.2 32l8.3-2.2c2.3 1.3 4.9 2 7.5 2 8.6 0 15.6-7 15.6-15.6S24.6.4 16 .4zm0 28.7c-2.4 0-4.8-.6-6.8-1.8l-.5-.3-4.9 1.3 1.3-4.8-.3-.5c-1.3-2-2-4.4-2-6.8 0-7.2 5.9-13.1 13.1-13.1S29.1 8.8 29.1 16 23.2 29.1 16 29.1z"/>
        </svg>
    </a>

    <!-- ===== JS ===== -->
    <script>
        function toggleMenu() {
           const navLinks = document.getElementById("navLinks");
           const overlay = document.getElementById("menuOverlay");
           const menuToggle = document.querySelector(".menu-toggle");
           const isOpen = navLinks.classList.toggle("active");

           navLinks.classList.toggle("show", isOpen);
           overlay.classList.toggle("active", isOpen);
           document.body.classList.toggle("menu-open", isOpen);

           if (menuToggle) {
               menuToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
           }
        }
    </script>

    <script src="{% static 'js/script.js' %}?v=109"></script>

</body>
</html>
